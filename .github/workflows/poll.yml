name: CGV SCREENX Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cgv-screenx-alert
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npm start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "cgv-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "state update"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 충돌, 최신 내용 받아서 재시도 ($i/5)"
            git fetch origin main
            # data/state.json은 여러 실행이 각자 통째로 다시 쓰는 파일이라 텍스트 충돌이 날 수 있음.
            # 이미 이번 실행에서 발견한 회차는 텔레그램 알림이 나간 뒤라 상태 파일 반영이 한 번 빠져도
            # 치명적이지 않으므로, 충돌나면 억지로 맞추려 하지 말고 원격(최신) 쪽을 우선해서 병합.
            if ! git merge -X theirs --no-edit origin/main; then
              echo "병합도 실패, 원격 기준으로 강제 정렬"
              git merge --abort || true
              git reset --hard origin/main
              exit 0
            fi
          done
          echo "5번 재시도했지만 push 실패"
          exit 1

name: CGV SCREENX Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cgv-screenx-alert
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "cgv-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "state update"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 충돌, 최신 내용 받아서 재시도 ($i/5)"
            git pull --rebase --no-edit origin main
          done
          echo "5번 재시도했지만 push 실패"
          exit 1
